<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Luvé on Store</title>

    <style>
      body {
        font-family: Arial;
        margin: 0;
        background: #f5f5f5;
      }
      header {
        background: #ff6600;
        color: #fff;
        padding: 15px;
        text-align: center;
      }
      .products {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 10px;
        padding: 10px;
      }
      .card {
        background: #fff;
        padding: 10px;
        border-radius: 10px;
        text-align: center;
      }
      button {
        background: #ff6600;
        color: #fff;
        border: none;
        padding: 8px;
        border-radius: 5px;
        cursor: pointer;
      }
      .auth {
        background: #fff;
        padding: 15px;
        margin: 10px;
        border-radius: 10px;
      }
      input {
        width: 100%;
        padding: 10px;
        margin: 5px 0;
      }
      #cart {
        position: fixed;
        bottom: 10px;
        right: 10px;
        background: #000;
        color: #fff;
        padding: 10px;
        border-radius: 10px;
      }
    </style>
  </head>

  <body>
    <header>
      <h2>🛒 Luvé on Store</h2>
      <!-- <p id="user">Не авторизован</p> -->
    </header>

    <div class="filters">
  <select id="categoryFilter">
    <option value="">Все категории</option>
    <option value="clothes">Одежда</option>
    <option value="tech">Техника</option>
  </select>

  <select id="priceFilter">
    <option value="">Любая цена</option>
    <option value="low">До 5000</option>
    <option value="high">От 5000</option>
  </select>
</div>

    <!-- <div class="auth">
      <h2>Регистрация и Вход</h2>
      <input type="email" id="email" placeholder="Email" />
      <input type="password" id="password" placeholder="Пароль" />
      <input
        type="password"
        id="confirmPassword"
        placeholder="Повторите пароль"
      />
      <button onclick="register()">Регистрация</button>
      <button onclick="login()">Вход</button>
      <button onclick="logout()">Выйти</button>
      <p id="message"></p>
    </div> -->

  <div id="products" class="grid"></div>

    <div style="padding: 10px">
      <button onclick="goToCheckout()">Перейти в корзину</button>
    </div>

    <div id="cart">🛒 0</div>

    <script>
      let cart = [];
      let currentUser = null;

      // ===== AUTH =====
      function register() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;

        fetch("/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password, confirmPassword }),
        })
          .then((res) => res.json())
          .then((data) => {
            showMessage(data.success ? data.message : data.error);
          });
      }

      function login() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.success) {
              currentUser = data.email;
              document.getElementById("user").innerText =
                "Вы вошли: " + data.email;
            }
            showMessage(data.success ? "Успешно" : data.error);
          });
      }

      function logout() {
        currentUser = null;
        document.getElementById("user").innerText = "Не авторизован";
      }

      // ===== UI =====
      function showMessage(msg) {
        const el = document.getElementById("message");
        el.innerText = msg;
        setTimeout(() => (el.innerText = ""), 3000);
      }

      // ===== PRODUCTS =====
      const products = [
        { name: "Телефон", price: 120000 },
        { name: "Наушники", price: 20000 },
        { name: "Для авто", price: 15000 },
      ];

      function render() {
        let html = "";

        products.forEach((p, i) => {
          html += `
      <div class="card">
        <h3>${p.name}</h3>
        <p>${p.price} AMD</p>
        <button onclick="addToCart()">Купить</button>
      </div>
    `;
        });

        document.getElementById("products").innerHTML = html;
      }

      function addToCart() {
        if (!currentUser) return alert("Сначала войди");

        cart++;
        document.getElementById("cart").innerText = "🛒 " + cart;
      }

      function goToCheckout() {
        if (!currentUser) return alert("Войдите");
        if (cart === 0) return alert("Корзина пуста");

        alert("Переход в корзину...");
      }

      render();
    </script>
  </body>
</html>
