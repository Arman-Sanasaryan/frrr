<!DOCTYPE html>
<html>
<body>

<h2>Login</h2>
<input id="user" placeholder="логин">
<input id="pass" type="password" placeholder="пароль">
<button onclick="login()">Войти</button>

<h2>Добавить товар</h2>
<form id="form">
  <input name="name" placeholder="Название"><br>
  <input name="price" placeholder="Цена"><br>
  <input type="file" name="image"><br>
  <button>Добавить</button>
</form>

<ul id="list"></ul>

<script>
let token = "";

async function login() {
  const res = await fetch("http://localhost:3000/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      username: user.value,
      password: pass.value
    })
  });

  const data = await res.json();
  token = data.token;
  alert("Вошел");
  loadProducts();
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const formData = new FormData(e.target);

  await fetch("http://localhost:3000/add-product", {
    method: "POST",
    headers: { "Authorization": token },
    body: formData
  });

  loadProducts();
});

async function loadProducts() {
  const res = await fetch("http://localhost:3000/products");
  const products = await res.json();

  list.innerHTML = "";

  products.forEach(p => {
    list.innerHTML += 
      <li>
        ${p.name} - ${p.price}
        <button onclick="del('${p._id}')">❌</button>
      </li>
    ;
  });
}

async function loadOrders() {
  const res = await fetch("http://localhost:3000/orders", {
    headers: { "Authorization": token }
  });

  const orders = await res.json();

  orders.forEach(o => {
    list.innerHTML += 
      <li>
        ${o.total} драм - ${o.status}
        <button onclick="update('${o._id}', 'доставляется')">🚚</button>
      </li>
    ;
  });
}

async function del(id) {
  await fetch("http://localhost:3000/delete-product/" + id, {
    method: "DELETE",
    headers: { "Authorization": token }
  });

  loadProducts();
}
</script>

</body>
</html>
