<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Wholesale Collective</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div id="app" class="wrap">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo">WC</div>
          <div class="title">AAAURRRSSIMPIRE</div>
        </div>
        <nav class="nav">
          <a class="nav-item active">Home</a>
          <a class="nav-item">Products</a>
          <a class="nav-item">Contact</a>
        </nav>
        <footer class="side-footer">Secure crypto & telegram support</footer>
      </aside>

      <main class="main">
        <!-- Fullscreen welcome overlay -->
        <div class="welcome-overlay overlay-in" id="welcome-overlay">
          <div class="welcome-panel">
            <section id="welcome-screen" class="panel center-panel">
              <h1 class="hero">wHooo aRrre Юу???????</h1>
              <div class="input-row">
                <input id="name-input" placeholder="Your name" />
                <button id="enter-btn" class="btn primary">Continue</button>
              </div>
            </section>
          </div>
        </div>

        <section id="main-screen" class="panel hidden grid">
          <header class="main-header">
            <h2 id="greeting" class="greeting">Hello</h2>
            <div class="header-actions"> <button class="btn ghost">Profile</button> </div>
          </header>
          <div class="products-wrap">
            <div id="products" class="products"></div>
          </div>
        </section>

      </main>

      <div id="chat-screen" class="chat-panel hidden">
        <div class="chat-top">
          <div class="chat-title">Seller Chat</div>
          <button id="close-chat" class="btn icon">✕</button>
        </div>
        <div id="chat-box" class="chat-box"></div>
        <div class="chat-input">
          <input id="chat-msg" placeholder="Type a message..." />
          <button id="send-msg" class="btn primary">Send</button>
        </div>
      </div>

    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
